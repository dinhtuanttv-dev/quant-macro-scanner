name: Market Announcement Watch (Gemini)

on:
  schedule:
    # Thu 2 hang tuan, 2:00 UTC (~9h VN) - tan suat thap vi cac thong bao nay hiem xay ra
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  vn30-watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Kiem tra HOSE da cong bo ky ra soat VN30 tiep theo chua
        run: |
          curl -f --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tuan-quant-scanner-psi.vercel.app/api/catalysts/vn30-review-watch"

  msci-watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Kiem tra MSCI da cong bo nang hang Viet Nam chua
        run: |
          curl -f --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tuan-quant-scanner-psi.vercel.app/api/catalysts/msci-upgrade-watch"

  sbv-watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Kiem tra SBV co vua thay doi lai suat dieu hanh khong
        run: |
          curl -f --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://tuan-quant-scanner-psi.vercel.app/api/catalysts/sbv-rate-watch"
